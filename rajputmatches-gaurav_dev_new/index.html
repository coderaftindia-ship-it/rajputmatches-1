<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      if (typeof global === 'undefined') {
        window.global = window;
      }
    </script>
    <meta charset="utf-8" />
    <link rel="icon" href="/logoWhite.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Rajput Alliances - Find your perfect match!"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="dns-prefetch" href="https://api.rajputalliances.com" />
    <link rel="dns-prefetch" href="http://localhost:5000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preconnect to both production and local API for LCP images (logo, banner, matchmaking) -->
    <link rel="preconnect" href="https://api.rajputalliances.com" crossorigin />
    <link rel="preconnect" href="http://localhost:5000" crossorigin />
    <!-- Critical CSS: reserve space for navbar + banner before Bootstrap loads (eliminates CLS) -->
    <style>
      *,*::before,*::after{box-sizing:border-box}
      html{scroll-behavior:smooth;overflow-x:hidden}
      body{margin:0;background:#FCF5EA;font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow-x:hidden}
      #root{min-height:100vh}
      /* Reserve navbar height so content doesn't jump */
      nav,navbar,.navbar{min-height:64px}
      /* Reserve banner area dimensions to prevent CLS */
      .banner-wrapper{min-height:100svh;position:relative;display:flex;flex-direction:column}
      /* Core positioning utilities */
      .position-relative{position:relative!important}
      .position-absolute{position:absolute!important}
      .position-fixed{position:fixed!important}
      .overflow-hidden{overflow:hidden!important}
      /* Core sizing */
      .w-100{width:100%!important}
      .h-100{height:100%!important}
      .d-none{display:none!important}
      .d-flex{display:flex!important}
      .d-block{display:block!important}
      /* Images */
      img{display:block;max-width:100%;height:auto}
      /* Container */
      .container{width:100%;padding-right:12px;padding-left:12px;margin-right:auto;margin-left:auto}
      @media(min-width:576px){.container{max-width:540px}}
      @media(min-width:768px){.container{max-width:720px}}
      @media(min-width:992px){.container{max-width:960px}}
      @media(min-width:1200px){.container{max-width:1140px}}
      @media(min-width:1400px){.container{max-width:1320px}}
    </style>
    <!-- Preload Bootstrap so download begins immediately alongside HTML parse -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" as="style" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <!-- Bootstrap CSS: synchronous — prevents CLS 0.429 layout shift (critical for Lighthouse score) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" as="style" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
        rel="stylesheet"
      />
    </noscript>

    <title>Rajput Alliances</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
